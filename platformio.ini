; Meshputer — Meshtastic chat client for the M5Stack Cardputer and Tab5.
; Build: make build   Flash: make flash   Logs: make monitor   Tests: make test

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@6.7.0
; Cardputer = M5Stamp S3: ESP32-S3, 8 MB flash, no PSRAM.
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; esptool's RAM stub intermittently fails over the S3's USB-JTAG port
; ("Unable to verify flash chip connection"); the ROM loader is reliable.
upload_flags = --no-stub

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    ; We only ever act as a BLE central talking to one radio.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Defines MESHPUTER_VERSION from `git describe` (shown in Settings > About).
extra_scripts = pre:tools/pio_version.py
; The touch UI is the Tab5's.
build_src_filter = +<*> -<tab5/>

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    h2zero/NimBLE-Arduino@2.4.0
    nanopb/Nanopb@0.4.91
    links2004/WebSockets@2.7.3

; M5Stack Tab5: ESP32-P4 (Wi-Fi/BLE on the ESP32-C6 via esp-hosted), 720x1280 touch.
; Its own touch UI on LVGL 9 (src/tab5) that follows the device's orientation.
; BLE uses the arduino-esp32 stack because NimBLE-Arduino does not support the P4.
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = m5stack-tab5-p4
board_build.partitions = default_16MB.csv
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMESHPUTER_BOARD_TAB5
    -DMESHPUTER_BLE_ARDUINO
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc/tab5
extra_scripts = pre:tools/pio_version.py
; The Cardputer's keyboard screens are not built for the Tab5.
build_src_filter = +<*> -<screens/> -<ui.cpp> -<ui_cardputer.cpp> -<board_cardputer.cpp>
; M5Unified/M5GFX come from the board's own script (pinning them here would
; install a second, conflicting copy).
lib_deps =
    nanopb/Nanopb@0.4.91
    links2004/WebSockets@2.7.3
    lvgl/lvgl@9.3.0
lib_ignore =
    NimBLE-Arduino
    M5Cardputer
