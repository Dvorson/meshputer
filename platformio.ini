; Meshputer — Meshtastic chat client for the M5Stack Cardputer.
; Build: make build   Flash: make flash   Logs: make monitor   Tests: make test

[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32@6.7.0
; Cardputer = M5Stamp S3: ESP32-S3, 8 MB flash, no PSRAM.
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
; esptool's RAM stub intermittently fails over the S3's USB-JTAG port
; ("Unable to verify flash chip connection"); the ROM loader is reliable.
upload_flags = --no-stub

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    ; We only ever act as a BLE central talking to one radio.
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Defines MESHPUTER_VERSION from `git describe` (shown in Settings > About).
extra_scripts = pre:tools/pio_version.py

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5Unified@0.2.23
    m5stack/M5GFX@0.2.30
    h2zero/NimBLE-Arduino@2.4.0
    nanopb/Nanopb@0.4.91
    links2004/WebSockets@2.7.3
